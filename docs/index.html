<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy - ClawChives Mobile</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Tailwind config matching ClawChives signature -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {}
      }
    }
  </script>
  <style>
    /* Custom markdown typography styles to match Landing Page */
    #content h1 { @apply text-4xl font-extrabold tracking-tight mb-8 text-slate-900 dark:text-white; }
    #content h2 { @apply text-2xl font-bold tracking-tight mt-10 mb-4 text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-2; }
    #content p { @apply text-slate-600 dark:text-slate-300 mb-6 leading-relaxed; }
    #content ul { @apply list-disc list-inside mb-6 text-slate-600 dark:text-slate-300 space-y-2; }
    #content li { @apply ml-4; }
    #content strong { @apply font-semibold text-slate-900 dark:text-white; }
    #content a { @apply text-cyan-600 dark:text-cyan-400 hover:underline font-medium; }
    #content hr { @apply my-8 border-slate-200 dark:border-slate-800; }
    #content em { @apply italic text-slate-500 dark:text-slate-400; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-cyan-50 to-amber-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 antialiased selection:bg-cyan-500/30 flex flex-col">

  <!-- Simple Navbar imitating Landing Page -->
  <header class="sticky top-0 z-50 w-full border-b border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-950/50 backdrop-blur-xl">
    <div class="flex h-16 items-center px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
      <div class="inline-flex items-center gap-3 cursor-pointer select-none">
        <div class="w-10 h-10 bg-gradient-to-br from-red-500 to-red-600 rounded-xl flex items-center justify-center shadow-lg shadow-red-200 dark:shadow-red-900/20 origin-bottom flex-shrink-0">
          <span class="text-2xl select-none">🦞</span>
        </div>
        <div class="flex items-center text-xl font-bold tracking-tight">
          <span class="text-cyan-600 dark:text-cyan-400">Claw</span>
          <span class="text-red-600 dark:text-red-500">Chives</span>
          <span class="text-slate-500 text-[0.6em] font-normal ml-0.5 self-end mb-1 tracking-tighter">©™</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="w-full max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16 flex-1">
    <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 p-8 sm:p-12 relative overflow-hidden">
      <!-- Decorative gradient orb -->
      <div class="absolute -top-24 -right-24 w-48 h-48 bg-cyan-500/20 dark:bg-cyan-500/10 blur-3xl rounded-full pointer-events-none"></div>
      
      <div id="content" class="markdown-body relative z-10">
        <!-- Loader while parsing Markdown -->
        <div class="flex justify-center items-center h-32">
          <div class="w-8 h-8 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Simple Footer imitating Landing Page -->
  <footer class="bg-slate-900 text-slate-400 py-12 px-4 sm:px-6 lg:px-8 mt-auto border-t border-slate-800">
    <div class="max-w-7xl mx-auto">
      <div class="flex flex-col md:flex-row justify-between items-center">
        <div class="flex items-center gap-3 mb-6 md:mb-0">
          <div class="inline-flex items-center gap-3 select-none">
            <div class="w-10 h-10 bg-gradient-to-br from-red-500 to-red-600 rounded-xl flex items-center justify-center shadow-lg shadow-red-900/20 flex-shrink-0">
              <span class="text-2xl select-none">🦞</span>
            </div>
            <div class="flex items-center text-xl font-bold tracking-tight">
              <span class="text-cyan-400">Claw</span>
              <span class="text-red-500">Chives</span>
              <span class="text-slate-500 text-[0.6em] font-normal ml-0.5 self-end mb-1 tracking-tighter">©™</span>
            </div>
          </div>
        </div>
        <div class="text-sm">
          © 2026 ClawChives. Your Sovereign <span class="text-red-500 font-semibold">Pinchmark</span> Library.
        </div>
      </div>
    </div>
  </footer>

  <script>
    // Fetch and render the markdown using marked.js
    fetch('./privacy-policy.md')
      .then(response => {
        if (!response.ok) throw new Error('Failed to load privacy policy: ' + response.statusText);
        return response.text();
      })
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(error => {
        document.getElementById('content').innerHTML = 
          '<div class="text-red-500 p-4 bg-red-50 dark:bg-red-900/20 rounded-xl border border-red-200 dark:border-red-900/50">' +
          '<h3 class="font-bold mb-2">Error Loading Policy</h3>' +
          '<p>Unable to load the privacy policy document. Please verify that privacy-policy.md exists in the same directory.</p>' +
          '</div>';
        console.error(error);
      });
  </script>
</body>
</html>
